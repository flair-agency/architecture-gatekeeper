name: Task
description: Propose one focused, reviewable unit of work
title: "Task: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe why this work is needed and which shared-package concern it addresses.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the observable result when this task is complete.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what is in scope and out of scope, including affected areas.
    validations:
      required: true
  - type: textarea
    id: assurance_dependency
    attributes:
      label: Owner decisions and assurance (optional)
      description: Note affected boundaries or a needed canonical owner decision, or state that none is known. Link a real owner issue if one exists; do not invent one or decide it here.
  - type: textarea
    id: acceptance_verification
    attributes:
      label: Acceptance and verification criteria
      description: List separate, observable criteria. For each, say how completion will be verified.
      placeholder: |
        - [ ] Observable criterion — verify by ...
        - [ ] Observable criterion — verify by ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and related work
      description: Link existing issues or state that none are known. Do not invent owner-decision issues.
  - type: input
    id: owner
    attributes:
      label: Proposed owner (optional)
      description: Name a responsible maintainer only if already known; maintainers confirm assignment during triage.
