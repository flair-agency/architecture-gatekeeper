name: Self Architecture Gate Protected Receiver

on:
  workflow_run:
    workflows: [Self Architecture Gate]
    types: [completed]

permissions: {}

jobs:
  codex-action-integrity:
    if: github.repository == 'flair-agency/architecture-gatekeeper' && github.ref == 'refs/heads/main' && github.event.workflow_run.event == 'merge_group' && vars.OWNER_AMENDMENT_RECEIVER_ENABLED == 'true'
    name: codex-action-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the protected verifier and provenance
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .architecture-gatekeeper-runtime
          persist-credentials: false
      - name: Check out the pinned Codex Action without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: flair-agency/codex-action
          ref: 643fb31fa44e961453125534c4c7182a5a0a6ba0
          fetch-depth: 0
          path: .codex-action-source
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 10.33.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .codex-action-source/pnpm-lock.yaml
      - name: Verify the pinned action before exposing review credentials
        run: |
          node .architecture-gatekeeper-runtime/src/verify-codex-action.mjs \
            .architecture-gatekeeper-runtime/provenance/codex-action-v1.12-runtime-cancellation.json \
            .codex-action-source
          cd .codex-action-source
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test
          test -z "$(git status --short -- dist)"

  protected-queue-receiver:
    needs: codex-action-integrity
    if: needs.codex-action-integrity.result == 'success' && github.repository == 'flair-agency/architecture-gatekeeper' && github.ref == 'refs/heads/main' && github.event.workflow_run.event == 'merge_group' && vars.OWNER_AMENDMENT_RECEIVER_ENABLED == 'true'
    name: protected-queue-receiver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: architecture-gate-self-protected
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out only the protected default-branch revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Resolve the wake-up to current live queue context
        id: resolve
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-workflow-run-receiver.mjs" resolve
      - name: Verify previous-base policy and exact amendment evidence
        id: verify
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          OWNER_AMENDMENT_TAG_RULESET_ID: ${{ vars.OWNER_AMENDMENT_TAG_RULESET_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-gate.mjs"
      - name: Prepare fresh ordinary review for exact current base and B
        id: prepare-ordinary
        if: steps.resolve.outcome == 'success' && steps.verify.outcome == 'success' && steps.verify.outputs.route == 'ordinary'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
          B_SHA: ${{ steps.verify.outputs.b_sha }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-ordinary-review.mjs" prepare
      - name: Run the fresh read-only ordinary review
        id: ordinary-review
        if: needs.codex-action-integrity.result == 'success' && steps.prepare-ordinary.outcome == 'success'
        timeout-minutes: 5
        uses: flair-agency/codex-action@643fb31fa44e961453125534c4c7182a5a0a6ba0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/owner-amendment-merge-group/ordinary-prompt.md
          output-schema-file: ${{ runner.temp }}/owner-amendment-merge-group/ordinary-schema.json
          model: ${{ steps.prepare-ordinary.outputs.model }}
          effort: ${{ steps.prepare-ordinary.outputs.effort }}
          sandbox: read-only
          safety-strategy: drop-sudo
          timeout-seconds: "240"
          codex-args: '["--ephemeral","-c","project_doc_max_bytes=0","--json"]'
      - name: Require exact-tuple deterministic ordinary PASS
        id: ordinary-validation
        if: steps.prepare-ordinary.outcome == 'success' && steps.ordinary-review.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.verify.outputs.base_sha }}
          B_SHA: ${{ steps.verify.outputs.b_sha }}
          DECISION: ${{ steps.ordinary-review.outputs.final-message }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-ordinary-review.mjs" validate
      - name: Publish only the independently verified result for the exact live queue SHA
        if: always() && steps.resolve.outcome == 'success'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_OUTCOME: ${{ steps.verify.outcome }}
          VERIFIED_ROUTE: ${{ steps.verify.outputs.route }}
          ORDINARY_VALIDATION_OUTCOME: ${{ steps.ordinary-validation.outcome }}
          OWNER_AMENDMENT_APP_ID: ${{ vars.OWNER_AMENDMENT_APP_ID }}
          OWNER_AMENDMENT_APP_INSTALLATION_ID: ${{ vars.OWNER_AMENDMENT_APP_INSTALLATION_ID }}
          OWNER_AMENDMENT_APP_PRIVATE_KEY: ${{ secrets.OWNER_AMENDMENT_APP_PRIVATE_KEY }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-workflow-run-receiver.mjs" publish
