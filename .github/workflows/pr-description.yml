name: PR description

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Metadata only: never check out or execute candidate code, request secrets,
# write to the PR, or change protected architecture acceptance.
permissions: {}

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check delivery record
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const body = String(event.pull_request?.body ?? '');
          // Ignore instructions and fenced examples: they are not completed fields.
          const visible = [];
          let fence = null;
          for (const line of body.replace(/<!--[\s\S]*?(?:-->|$)/g, '').split(/\r?\n/)) {
            if (fence) {
              const closing = line.match(/^ {0,3}(`+|~+)[ \t]*$/);
              if (closing && closing[1][0] === fence[0] && closing[1].length >= fence.length) fence = null;
              continue;
            }
            const opening = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
            if (opening && (opening[1][0] !== '`' || !opening[2].includes('`'))) {
              fence = opening[1];
              continue;
            }
            visible.push(line);
          }
          const text = visible.join('\n');
          const headings = [...text.matchAll(/^## +([^\n]+?) *$/gm)];
          const required = ['Outcome', 'Issue coverage', 'Verification', 'Remaining work', 'Authority and assurance'];
          const errors = [];
          const fields = {};
          for (const name of required) {
            const matches = headings.filter(h => h[1] === name);
            if (matches.length !== 1) {
              errors.push(`Include exactly one ## ${name} section.`);
              continue;
            }
            const h = matches[0];
            const next = headings.find(other => other.index > h.index);
            const value = text.slice(h.index + h[0].length, next?.index ?? text.length).trim();
            fields[name] = value;
            const content = value.replace(/^[-*] +\[[ xX]\] */gm, '').trim();
            if (!content || /^(?:N\/?A|None|TBD|TODO|_No response_|\.\.\.)[.!]?$/i.test(content)
                || /^<[^>]+>$/.test(content)) errors.push(`Complete ## ${name}; explain non-applicable fields.`);
          }
          const hasIssue = value => /(?:^|[\s(])(?:[\w.-]+\/[\w.-]+)?#\d+\b|https:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+\b/.test(value ?? '');
          if (fields['Issue coverage'] && !hasIssue(fields['Issue coverage'])
              && !/^N\/?A\b[\s:—-]+\S[\s\S]+/i.test(fields['Issue coverage'])) {
            errors.push('Issue coverage needs an issue reference or N/A with a reason.');
          }
          if (fields['Remaining work'] && !hasIssue(fields['Remaining work'])
              && !/^None\b[\s:—-]+\S[\s\S]+/i.test(fields['Remaining work'])) {
            errors.push('Remaining work needs an owning issue reference or None with a reason.');
          }
          const summary = ['# PR description completeness', ...errors.map(e => `- ${e}`)];
          if (!errors.length) summary.push('Required sections are populated. This does not verify claims, tests, authority, security, or acceptance.');
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          for (const error of errors) console.error(error);
          process.exitCode = errors.length ? 1 : 0;
          JS
