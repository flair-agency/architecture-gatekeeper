name: Self Architecture Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions: {}

jobs:
  architecture-gate:
    name: architecture-gate
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      actions: read
      # The reusable workflow downscopes each job. Only its separate BLOCK
      # evidence signer receives these capabilities; the model reviewer does not.
      id-token: write
      attestations: write
    uses: ./.github/workflows/architecture-gate.yml
    with:
      protected-review-instructions: true
      # Off by default. Enable only for a bounded self-review cost experiment.
      self-flex-probe: ${{ vars.ARCHITECTURE_GATE_SELF_FLEX == 'true' && vars.ARCHITECTURE_GATE_SELF_FLEX_PR == format('{0}', github.event.pull_request.number) && vars.ARCHITECTURE_GATE_SELF_FLEX_HEAD == github.event.pull_request.head.sha }}
      schema-path: .codex/gatekeeper/ci-decision.schema.json
      validation-path: .codex/gatekeeper/decision.validation.json
    secrets:
      # When fixed-self Environment isolation is enabled, the reusable
      # reviewer reads the key directly from that job's Environment.
      OPENAI_API_KEY: ${{ (github.repository != 'flair-agency/architecture-gatekeeper' || github.event_name != 'pull_request_target' || github.event.pull_request.base.ref != 'main' || github.event.pull_request.draft != false || github.workflow_ref != 'flair-agency/architecture-gatekeeper/.github/workflows/self-architecture-gate.yml@refs/heads/main' || vars.SELF_PROTECTED_MODEL_ENABLED != 'true') && secrets.OPENAI_API_KEY || '' }}

  merge-group-wakeup:
    name: merge-group-wakeup
    if: github.repository == 'flair-agency/architecture-gatekeeper' && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Complete the unprivileged queue wake-up
        run: test "$GITHUB_EVENT_NAME" = merge_group
