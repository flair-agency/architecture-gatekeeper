name: Self Architecture Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  architecture-gate:
    name: ${{ github.event_name == 'pull_request_target' && 'architecture-gate' || 'architecture-gate (not applicable)' }}
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      actions: read
      # The reusable workflow downscopes each job. Only its separate BLOCK
      # evidence signer receives these capabilities; the model reviewer does not.
      id-token: write
      attestations: write
    uses: ./.github/workflows/architecture-gate.yml
    with:
      protected-review-instructions: true
      # Off by default. Enable only for a bounded self-review cost experiment.
      self-flex-probe: ${{ vars.ARCHITECTURE_GATE_SELF_FLEX == 'true' && vars.ARCHITECTURE_GATE_SELF_FLEX_PR == format('{0}', github.event.pull_request.number) && vars.ARCHITECTURE_GATE_SELF_FLEX_HEAD == github.event.pull_request.head.sha }}
      schema-path: .codex/gatekeeper/ci-decision.schema.json
      validation-path: .codex/gatekeeper/decision.validation.json
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  merge-group-codex-action-integrity:
    if: github.repository == 'flair-agency/architecture-gatekeeper' && github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the protected merge-group base for the provenance verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          path: .architecture-gatekeeper-runtime
          persist-credentials: false
      - name: Check out the pinned Codex Action without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: flair-agency/codex-action
          ref: 643fb31fa44e961453125534c4c7182a5a0a6ba0
          fetch-depth: 0
          path: .codex-action-source
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 10.33.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .codex-action-source/pnpm-lock.yaml
      - name: Verify the pinned action before exposing review credentials
        run: |
          node .architecture-gatekeeper-runtime/src/verify-codex-action.mjs \
            .architecture-gatekeeper-runtime/provenance/codex-action-v1.12-runtime-cancellation.json \
            .codex-action-source
          cd .codex-action-source
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test
          test -z "$(git status --short -- dist)"

  merge-group-accept:
    name: ${{ github.event_name == 'merge_group' && 'architecture-gate / accept' || 'merge-group-accept (not applicable)' }}
    if: always() && github.repository == 'flair-agency/architecture-gatekeeper' && github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'
    needs: [merge-group-codex-action-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      attestations: read
    steps:
      - name: Require successful pinned Action integrity verification
        env:
          INTEGRITY_RESULT: ${{ needs.merge-group-codex-action-integrity.result }}
        run: test "$INTEGRITY_RESULT" = success
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Check out the protected merge-group base
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Copy the event payload to a fixed runner-temp path
        run: |
          set -euo pipefail
          event_dir="$RUNNER_TEMP/owner-amendment-merge-group"
          mkdir -m 700 -p "$event_dir"
          test ! -e "$event_dir/event.json"
          cp "$GITHUB_EVENT_PATH" "$event_dir/event.json"
          chmod 600 "$event_dir/event.json"
      - name: Verify the merge-group OWNER_AMENDMENT evidence chain
        id: gate
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_AMENDMENT_TAG_RULESET_ID: ${{ vars.OWNER_AMENDMENT_TAG_RULESET_ID }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-gate.mjs"
      - name: Prepare fresh ordinary review for exact current base and B
        id: prepare-ordinary
        if: steps.gate.outputs.route == 'ordinary'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          RUNNER_TEMP: ${{ runner.temp }}
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          B_SHA: ${{ steps.gate.outputs.b_sha }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-ordinary-review.mjs" prepare
      - name: Run fresh read-only ordinary review for exact current base and B
        id: ordinary-review
        if: steps.gate.outputs.route == 'ordinary'
        timeout-minutes: 5
        uses: flair-agency/codex-action@643fb31fa44e961453125534c4c7182a5a0a6ba0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/owner-amendment-merge-group/ordinary-prompt.md
          output-schema-file: ${{ runner.temp }}/owner-amendment-merge-group/ordinary-schema.json
          model: ${{ steps.prepare-ordinary.outputs.model }}
          effort: ${{ steps.prepare-ordinary.outputs.effort }}
          sandbox: read-only
          safety-strategy: drop-sudo
          timeout-seconds: "240"
          codex-args: '["--ephemeral","-c","project_doc_max_bytes=0","--json"]'
      - name: Require exact-tuple deterministic ordinary PASS
        if: steps.gate.outputs.route == 'ordinary'
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          B_SHA: ${{ steps.gate.outputs.b_sha }}
          DECISION: ${{ steps.ordinary-review.outputs.final-message }}
        run: node "$GITHUB_WORKSPACE/scripts/owner-amendment-merge-group-ordinary-review.mjs" validate
