name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Check strict TypeScript and generated output
        run: npm run check:typescript
      - name: Validate parsed workflow structure
        run: node --test test/workflow-structure.test.mjs
      - name: Check static source import cycles
        run: node scripts/check-source-cycles.mjs
      - name: Run tests
        run: npm test
      - name: Pack, install, and smoke-test the distributable package
        run: |
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/pack.json"
          ARCHIVE="$(node -p "require('$RUNNER_TEMP/pack.json')[0].filename")"
          case "$ARCHIVE" in
            ''|*/*) echo "npm pack returned an unsafe archive name" >&2; exit 1 ;;
          esac
          ARCHIVE_PATH="$GITHUB_WORKSPACE/$ARCHIVE"
          test -f "$ARCHIVE_PATH"
          node -e "const p=require(process.argv[1])[0]; const names=new Set(p.files.map(f=>f.path)); for (const required of ['package.json','README.md','docs/architecture.md','docs/architecture/authority-set.md','docs/architecture/owner-addition.md','docs/architecture/owner-amendment.md','docs/architecture/review-execution.md','docs/architecture/self-profile.md','docs/integration-reference.md','src/local-gate.mjs','src/manual-review.mjs','src/native-review.mjs','src/preview-lifecycle.mjs']) if (!names.has(required)) throw new Error('archive missing '+required); const pkg=JSON.parse(require('node:fs').readFileSync(process.argv[2])); if(pkg.exports?.['./preview-lifecycle']!=='./src/preview-lifecycle.mjs') throw new Error('preview lifecycle API export missing')" "$RUNNER_TEMP/pack.json" "$GITHUB_WORKSPACE/package.json"
          mkdir "$RUNNER_TEMP/install"
          cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm install --ignore-scripts --offline "$ARCHIVE_PATH"
          node "$GITHUB_WORKSPACE/test/installed-smoke.mjs" "$PWD/node_modules/.bin"

  codeql-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
      - name: Install official CodeQL CLI
        id: codeql
        uses: github/codeql-action/setup-codeql@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
      - name: Verify trusted output model and negative flows
        env:
          CODEQL_PATH: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          export PATH="$(dirname "$CODEQL_PATH"):$PATH"
          npm run codeql:model
