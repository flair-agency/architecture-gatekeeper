name: Architecture Gate

on:
  workflow_call:
    inputs:
      policy-path:
        type: string
        default: .codex/gatekeeper/ci-policy.json
      prompt-path:
        type: string
        default: .codex/gatekeeper/ci-prompt.md
      schema-path:
        type: string
        default: .codex/gatekeeper/decision.schema.json
      protected-review-instructions:
        type: boolean
        default: false
    secrets:
      OPENAI_API_KEY:
        required: false
      CI_SOURCE_READ_TOKEN:
        required: false

concurrency:
  group: architecture-gate-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      model: ${{ steps.resolve.outputs.model }}
      effort: ${{ steps.resolve.outputs.reasoningEffort }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .architecture-gatekeeper-runtime
          persist-credentials: false
      - name: Resolve policy from protected base revision
        id: resolve
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          POLICY_PATH: ${{ inputs.policy-path }}
        run: |
          if git show "$BASE_SHA:$POLICY_PATH" > "$RUNNER_TEMP/architecture-gate-policy.json"; then
            node .architecture-gatekeeper-runtime/src/resolve-ci-policy.mjs "$RUNNER_TEMP/architecture-gate-policy.json" "$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "Base revision has no CI policy; using fail-safe bootstrap enforcement."
            echo "baseBranch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
            echo "mode=enforced" >> "$GITHUB_OUTPUT"
            echo "model=gpt-5.6-sol" >> "$GITHUB_OUTPUT"
            echo "reasoningEffort=medium" >> "$GITHUB_OUTPUT"
          fi

  review:
    if: needs.policy.outputs.mode == 'enforced'
    needs: policy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
      reviewed_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Check enforced credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node -e 'if (!process.env.OPENAI_API_KEY) { console.error("Missing OPENAI_API_KEY for enforced Architecture Gate"); process.exit(1); }'
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CI_SOURCE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Record reviewed merge revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Materialize protected review instructions
        if: inputs.protected-review-instructions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMPT_PATH: ${{ inputs.prompt-path }}
          SCHEMA_PATH: ${{ inputs.schema-path }}
        run: |
          git show "$BASE_SHA:$PROMPT_PATH" > "$RUNNER_TEMP/architecture-gate-prompt.md"
          git show "$BASE_SHA:$SCHEMA_PATH" > "$RUNNER_TEMP/architecture-gate-decision.schema.json"
      - name: Run read-only architecture review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ inputs.protected-review-instructions && format('{0}/architecture-gate-prompt.md', runner.temp) || inputs.prompt-path }}
          model: ${{ needs.policy.outputs.model }}
          effort: ${{ needs.policy.outputs.effort }}
          sandbox: read-only
          safety-strategy: drop-sudo
          output-schema-file: ${{ inputs.protected-review-instructions && format('{0}/architecture-gate-decision.schema.json', runner.temp) || inputs.schema-path }}
          codex-args: '["--ephemeral"]'

  accept:
    if: always()
    needs: [policy, review]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pinned reporting runtime
        uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .architecture-gatekeeper-runtime
          persist-credentials: false
      - name: Publish human-readable result
        id: report
        if: always()
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          MODE: ${{ needs.policy.outputs.mode }}
          DECISION: ${{ needs.review.outputs.final_message }}
          REVIEWED_SHA: ${{ needs.review.outputs.reviewed_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ job.workflow_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .architecture-gatekeeper-runtime/src/ci-report.mjs
      - name: Require valid policy resolution
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          MODE: ${{ needs.policy.outputs.mode }}
        run: |
          test "$POLICY_RESULT" = success
          test "$MODE" = enforced || test "$MODE" = local-only
      - name: Record local-only waiver
        if: needs.policy.outputs.mode == 'local-only'
        run: |
          echo "Architecture Gate: ACCEPTED WITHOUT CI AI REVIEW"
          echo "Base branch: ${{ github.base_ref }}"
          echo "AI acceptance review: WAIVED BY BASE-BRANCH POLICY"
      - name: Require model-backed PASS
        if: needs.policy.outputs.mode == 'enforced'
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          CONCLUSION: ${{ steps.report.outputs.conclusion }}
        run: |
          test "$REVIEW_RESULT" = success
          test "$CONCLUSION" = PASS
