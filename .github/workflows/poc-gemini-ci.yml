name: PoC Gemini CI Architecture Review

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Gemini Model'
        required: false
        default: 'gemini-3.8-flash'
      effort:
        description: 'Reasoning effort (none, low, medium, high)'
        required: false
        default: 'low'
      wif_workload_identity_provider:
        description: 'GCP Workload Identity Provider resource name'
        required: false
        default: ''
      wif_service_account:
        description: 'GCP Service Account email'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/gemini-transport.mjs'
      - 'src/gemini-ci-runner.mjs'
      - '.github/workflows/poc-gemini-ci.yml'
  push:
    branches:
      - 'feature/gemini-ci-poc'

permissions:
  contents: read
  id-token: write # required for Google Cloud Workload Identity Federation

jobs:
  gemini-review-poc:
    name: Gemini CI Review PoC
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REVIEW_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
      REVIEW_EFFORT: ${{ inputs.effort || 'low' }}
      WIF_PROVIDER: ${{ inputs.wif_workload_identity_provider || secrets.GCP_WIF_PROVIDER || '' }}
      WIF_SERVICE_ACCOUNT: ${{ inputs.wif_service_account || secrets.GCP_WIF_SERVICE_ACCOUNT || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Authenticate via Google Cloud Workload Identity Federation if configured
      - name: Authenticate to Google Cloud (WIF)
        id: gcp-auth
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/generative-language'

      - name: Prepare Architecture Review Request
        id: prepare
        run: |
          mkdir -p "$RUNNER_TEMP/gemini-poc"
          cat << 'EOF' > "$RUNNER_TEMP/gemini-poc/prompt.md"
          You are an Architecture Gatekeeper reviewer.
          Evaluate the pull request for conformity with the normative repository architecture.
          Target: Review changes in src/gemini-ci-runner.mjs and test/gemini-ci-runner.test.mjs.
          Respond strictly in JSON matching the provided schema.
          EOF

          cat << 'EOF' > "$RUNNER_TEMP/gemini-poc/decision.schema.json"
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object",
            "required": ["decision", "summary"],
            "properties": {
              "decision": {
                "type": "string",
                "enum": ["PASS", "BLOCK", "OWNER_DECISION"]
              },
              "summary": {
                "type": "string"
              }
            },
            "additionalProperties": false
          }
          EOF

      - name: Run Gemini CI Review
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          node src/gemini-ci-runner.mjs \
            --prompt "$RUNNER_TEMP/gemini-poc/prompt.md" \
            --schema "$RUNNER_TEMP/gemini-poc/decision.schema.json" \
            --output "$RUNNER_TEMP/gemini-poc/decision.json" \
            --model "$REVIEW_MODEL" \
            --effort "$REVIEW_EFFORT"

      - name: Inspect Review Decision
        if: always()
        run: |
          echo "Decision Kind: ${{ steps.gemini.outputs.decision-kind }}"
          echo "Final Message: ${{ steps.gemini.outputs.final-message }}"
          if [ -f "$RUNNER_TEMP/gemini-poc/decision.json" ]; then
            cat "$RUNNER_TEMP/gemini-poc/decision.json"
          fi

      - name: Upload Decision Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-poc-decision
          path: ${{ runner.temp }}/gemini-poc/decision.json
