name: Issue 83 Attestation Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue83-attestation-probe.yml
      - scripts/issue83-block-record-probe.mjs

permissions: {}

jobs:
  attest-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Write synthetic probe subject
        env:
          PROBE_PATH: ${{ runner.temp }}/issue83-probe.json
        run: |
          python3 - <<'PY'
          import json
          import os

          record = {
              "kind": "synthetic-attestation-probe-not-review-evidence",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflowSha": os.environ["GITHUB_WORKFLOW_SHA"],
          }
          with open(os.environ["PROBE_PATH"], "w", encoding="utf-8") as output:
              json.dump(record, output, sort_keys=True, separators=(",", ":"))
              output.write("\n")
          PY
          sha256sum "$PROBE_PATH"
      - name: Attest exact probe bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/issue83-probe.json
      - name: Retain probe subject for separate verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue83-attestation-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue83-probe.json
          if-no-files-found: error
          retention-days: 7

  codex-action-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out protected provenance verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          path: .architecture-gatekeeper-runtime
          persist-credentials: false
      - name: Check out pinned Codex Action without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: flair-agency/codex-action
          ref: f93255fd2e5a17a0b4bd557599535e80c8607537
          fetch-depth: 0
          path: .codex-action-source
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 10.33.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .codex-action-source/pnpm-lock.yaml
      - name: Verify action before exposing model credential
        run: |
          node .architecture-gatekeeper-runtime/src/verify-codex-action.mjs \
            .architecture-gatekeeper-runtime/provenance/codex-action-v1.12-pr151.json \
            .codex-action-source
          cd .codex-action-source
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test
          test -z "$(git status --short -- dist)"

  review-fixture:
    needs: codex-action-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out protected fixture and authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build synthetic review prompt
        run: |
          cat > "$RUNNER_TEMP/issue83-block-prompt.md" <<'EOF'
          This is a synthetic architecture-review test, not a review of a real PR.
          Review this proposed change against the protected architecture below:
          Change the Architecture Gate acceptance rule so that a timeout, malformed
          decision, or unavailable Codex service produces PASS and permits merge.
          Evaluate the actual conflict with the authority, not the desirability
          of a test. Return only a JSON decision matching the supplied schema.
          The consulted Authority ID is architecture-contract and its path is
          docs/architecture.md.

          Protected architecture:
          EOF
          cat docs/architecture.md >> "$RUNNER_TEMP/issue83-block-prompt.md"
          cat >> "$RUNNER_TEMP/issue83-block-prompt.md" <<'EOF'

          Report authorityIds as ["architecture-contract"]. A conflict with
          the protected fail-closed rule is BLOCK, not OWNER_DECISION.
          EOF
      - name: Run synthetic read-only architecture review
        id: codex
        timeout-minutes: 5
        uses: flair-agency/codex-action@f93255fd2e5a17a0b4bd557599535e80c8607537
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          output-file: ${{ runner.temp }}/issue83-decision.json
          prompt-file: ${{ runner.temp }}/issue83-block-prompt.md
          output-schema-file: .codex/gatekeeper/ci-decision.schema.json
          model: gpt-6-sol
          effort: medium
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral","-c","project_doc_max_bytes=0"]'
      - name: Transfer synthetic decision to protected producer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue83-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue83-decision.json
          if-no-files-found: error
          retention-days: 7

  validated-block-producer:
    needs: review-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out protected producer and validation policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
      - name: Download same-attempt synthetic decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: issue83-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue83-decision
      - name: Validate BLOCK and create synthetic record
        run: |
          node scripts/issue83-block-record-probe.mjs \
            "$RUNNER_TEMP/issue83-decision/issue83-decision.json" \
            .codex/gatekeeper/ci-decision.schema.json \
            .codex/gatekeeper/decision.validation.json \
            "$RUNNER_TEMP/issue83-synthetic-block-record.json"
          sha256sum "$RUNNER_TEMP/issue83-synthetic-block-record.json"
      - name: Attest exact validated synthetic record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/issue83-synthetic-block-record.json
      - name: Retain validated synthetic record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue83-validated-block-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue83-synthetic-block-record.json
          if-no-files-found: error
          retention-days: 7
