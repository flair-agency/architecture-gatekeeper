name: Issue 333 isolated full-input Gemini review probe
on:
  push:
    branches: [codex/issue333-vertex-verification]
    paths:
      - .github/workflows/issue333-full-review-probe.yml
      - scripts/issue333-full-gemini-review-probe.mjs
permissions:
  contents: read
  id-token: write
jobs:
  synthetic-cli:
    if: github.repository == 'flair-agency/architecture-gatekeeper' && github.ref == 'refs/heads/codex/issue333-vertex-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
      # Installation precedes credential issuance; no repository lifecycle scripts.
      - name: Install exact investigation CLI
        shell: bash
        run: |
          install -d -m 700 "$RUNNER_TEMP/agk333-cli-runtime"
          cd "$RUNNER_TEMP/agk333-cli-runtime"
          npm install --ignore-scripts --no-audit --no-fund --save-exact @google/gemini-cli@0.62.0
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const cli = lock.packages['node_modules/@google/gemini-cli'];
          if (cli.version !== '0.62.0' || cli.integrity !== 'sha512-A1rw0Tf2sHLpGncfYdaq5WaJIufKAP8il4BmHD5Yw4ewmB/Wo0vRQb2bEvx7OqyaPFPZCh0hVhcMKsICZyIBww==') throw new Error('Pinned CLI artifact mismatch');
          NODE
      - name: Mask private deployment identifiers
        env:
          PROBE_IDENTITY: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          PROBE_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
        run: |
          node --input-type=module <<'NODE'
          const project = process.env.PROBE_IDENTITY?.split('@')[1]?.split('.iam.')[0];
          const number = /^projects\/(\d+)\//.exec(process.env.PROBE_PROVIDER ?? '')?.[1];
          for (const value of [project, number]) if (value && /^[a-z0-9-]+$/.test(value)) console.log(`::add-mask::${value}`);
          NODE
      - name: Exchange existing WIF identity after installation
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: One historical complete-input review with bounded Vertex dispatch
        env:
          PROBE_BEARER: ${{ steps.auth.outputs.access_token }}
          PROBE_PROJECT: ${{ steps.auth.outputs.project_id }}
          PROBE_CLI_ENTRYPOINT: ${{ runner.temp }}/agk333-cli-runtime/node_modules/@google/gemini-cli/bundle/gemini.js
        run: node scripts/issue333-full-gemini-review-probe.mjs
      - name: Remove investigation CLI runtime
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/agk333-cli-runtime"
