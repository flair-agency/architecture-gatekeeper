name: Publish fixed package

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed source commit to publish
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Validate fixed package identity
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("package.json"));
            const exact = value => /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(value);
            if (process.env.EXPECTED_SHA !== process.env.ACTUAL_SHA) throw Error("reviewed commit mismatch");
            if (process.env.ACTUAL_REF !== `refs/heads/${process.env.DEFAULT_BRANCH}`) throw Error("publication must run from the protected default branch");
            if (p.name !== "@flair-agency/architecture-gatekeeper" || !exact(p.version) || p.private === true) throw Error("invalid publish identity");
            if (p.repository?.url !== `https://github.com/${process.env.EXPECTED_REPOSITORY}.git`) throw Error("owning source association missing");
            if (p.publishConfig?.registry !== "https://npm.pkg.github.com") throw Error("registry missing");
          '
      - run: npm test
      - name: Inspect actual archive
        run: |
          npm pack --ignore-scripts --json > packed.json
          node --input-type=module -e '
            import fs from "node:fs";
            const [packed] = JSON.parse(fs.readFileSync("packed.json"));
            for (const file of packed.files) {
              if (/(^|\/)(node_modules|tmp|\.git)(\/|$)/.test(file.path)) throw Error(`forbidden payload ${file.path}`);
            }
            fs.writeFileSync("archive-name.txt", packed.filename);
          '
      - name: Execute installed package entrypoints
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import os from "node:os";
            import path from "node:path";
            import { execFileSync } from "node:child_process";
            const directory = fs.mkdtempSync(path.join(os.tmpdir(), "gatekeeper-install-"));
            const archive = path.resolve(fs.readFileSync("archive-name.txt", "utf8").trim());
            fs.writeFileSync(path.join(directory, "package.json"), JSON.stringify({ name: "registry-check", version: "1.0.0", private: true }));
            execFileSync("npm", ["install", archive, "--ignore-scripts", "--no-audit", "--no-fund"], { cwd: directory, stdio: "inherit" });
            const bin = name => path.join(directory, "node_modules", ".bin", name);
            const help = execFileSync(bin("architecture-gatekeeper"), ["--help"], { encoding: "utf8" });
            if (!help.startsWith("Usage: architecture-gatekeeper")) throw Error("Hook entrypoint did not execute");
            const policy = path.join(directory, "policy.json");
            fs.writeFileSync(policy, JSON.stringify({ version: 1, default: { mode: "local-only" }, branches: {} }));
            const resolved = execFileSync(bin("architecture-gate-policy"), [policy, "main"], { encoding: "utf8" });
            if (!resolved.includes("mode=local-only")) throw Error("Policy entrypoint did not execute");
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inspected-package
          path: |
            flair-agency-architecture-gatekeeper-*.tgz
            packed.json
            archive-name.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: inspected-package
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@flair-agency'
      - name: Check private package target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response="$(gh api /orgs/flair-agency/packages/npm/architecture-gatekeeper 2>&1)" && {
            test "$(printf '%s' "$response" | jq -r .visibility)" = private
            exit 0
          }
          printf '%s' "$response" | grep -q 'HTTP 404'
      - name: Publish inspected archive
        run: npm publish "$(cat archive-name.txt)" --ignore-scripts --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify private registry publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            const [packed] = JSON.parse(fs.readFileSync("packed.json"));
            const published = JSON.parse(execFileSync("npm", ["view", `@flair-agency/architecture-gatekeeper@${packed.version}`, "--json"], { encoding: "utf8" }));
            if (published.dist.integrity !== packed.integrity) throw Error("published integrity differs from inspected archive");
          '
          test "$(gh api /orgs/flair-agency/packages/npm/architecture-gatekeeper --jq .visibility)" = private
